name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Susun aplikasi dari folder src
        run: node build.js
      - name: Siapkan proyek
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6
          echo '{"appId":"id.iman.hafalankotoba","appName":"Hafalan Kotoba Irodori","webDir":"www"}' > capacitor.config.json
          npx cap add android
          npx cap sync android
      - name: Pakai kunci tetap agar APK baru bisa menimpa yang lama
        run: |
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore
      - name: Bangun APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Ganti nama APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk HafalanKotoba-Irodori.apk
      - name: Terbitkan APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: APK ${{ github.run_number }}
          files: HafalanKotoba-Irodori.apk
