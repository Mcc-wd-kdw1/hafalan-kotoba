<title>Hafalan Kotoba Irodori by Iman</title>

<style>
/* Layout: aplikasi satu kolom (maks 720px) dengan bilah tab di bawah layar: Belajar, Kotoba, Statistik, Riwayat. Kartu hafalan besar di tengah. */
:root{
  --bg:#f0f1f6; --surface:#ffffff; --raise:#f5f6fb; --ink:#182038; --muted:#586180; --line:#d8dbe8;
  --accent:#2e4ab5; --accent-ink:#ffffff; --accent-soft:#e3e7f9;
  --good:#1a7f46; --good-soft:#dcf2e5; --warn:#b4540a; --bad:#b3261e; --bad-soft:#fbe4e2;
  --f-kanji:'Shippori Mincho','Hiragino Mincho ProN','Yu Mincho',serif;
  --f-body:'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1220; --surface:#171d30; --raise:#1d2540; --ink:#e8ecf8; --muted:#98a2c0; --line:#2a3452;
  --accent:#93a6ff; --accent-ink:#0e1220; --accent-soft:#232d54;
  --good:#62d28d; --good-soft:#163625; --warn:#f0a35e; --bad:#ff8f86; --bad-soft:#3a1c1f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1220; --surface:#171d30; --raise:#1d2540; --ink:#e8ecf8; --muted:#98a2c0; --line:#2a3452;
  --accent:#93a6ff; --accent-ink:#0e1220; --accent-soft:#232d54;
  --good:#62d28d; --good-soft:#163625; --warn:#f0a35e; --bad:#ff8f86; --bad-soft:#3a1c1f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:14px 92px;-webkit-tap-highlight-color:transparent}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,label:focus-within{outline:2px solid var(--accent);outline-offset:2px}
header{display:flex;align-items:center;gap:12px}
.mark{flex:none;width:42px;height:42px;border-radius:10px;background:var(--accent);color:var(--accent-ink);font-family:var(--f-kanji);font-size:1.7rem;font-weight:700;display:grid;place-items:center;line-height:1}
.ttl{min-width:0}
h1{font-family:var(--f-kanji);font-size:1.2rem;margin:0;font-weight:700;line-height:1.2;text-wrap:balance}
.by{font-size:.78rem;color:var(--muted)}
main{display:flex;flex-direction:column;gap:14px;min-width:0}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));gap:4px}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border-radius:10px;color:var(--muted);font-size:.74rem;font-weight:500}
.tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-selected="true"]{color:var(--accent);background:var(--accent-soft);font-weight:700}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
h2{font-size:.76rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0;font-weight:700}
h3.sub{margin:0;font-family:var(--f-kanji);font-size:1.15rem}
p.lead{margin:0;color:var(--muted);font-size:.9rem}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}
.btn{border:1px solid var(--line);background:var(--surface);padding:10px 14px;border-radius:10px;font-weight:500;min-height:42px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.btn.primary:disabled{opacity:.4;cursor:not-allowed}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.fill{background:var(--bad);color:var(--surface);font-weight:700}
.btn.small{padding:6px 11px;font-size:.85rem;min-height:34px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:none;padding:8px 12px;font-size:.9rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.opts>div{display:flex;flex-direction:column;gap:6px;min-width:0}
.opts span{font-size:.8rem;color:var(--muted)}
.book{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.book b{font-family:var(--f-kanji);font-size:1.05rem}
.chs{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.ch{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:11px 12px;border-top:1px solid var(--line);cursor:pointer;background:var(--surface);width:100%;text-align:left;border-left:0;border-right:0;border-bottom:0}
.chs>:first-child{border-top:0}
.ch:hover{background:var(--accent-soft)}
.ch input{width:20px;height:20px;accent-color:var(--accent)}
.ch.go{grid-template-columns:1fr auto}
.ch .t{min-width:0}
.ch .t b{font-weight:700;font-variant-numeric:tabular-nums}
.ch .t span.s{display:block;color:var(--muted);font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch .n{font-size:.8rem;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums;min-width:56px}
.badge{display:inline-block;font-size:.68rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:1px 7px;border-radius:99px;background:var(--accent-soft);color:var(--accent);margin-left:6px;vertical-align:1px}
.bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--good)}
.resume{background:var(--accent-soft);border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.resume p{margin:0;min-width:0}
.resume small{color:var(--muted);display:block}
.studytop{display:flex;align-items:center;gap:12px}
.studytop .grow{flex:1;min-width:0}
.cnt{font-variant-numeric:tabular-nums;font-size:.85rem;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:5px}
.bar.big{height:7px;margin:0}
.bar.big i{background:var(--accent)}
.cardwrap{perspective:1200px}
.card{position:relative;width:100%;min-height:320px;height:min(50svh,400px);cursor:pointer;border:0;background:none;padding:0;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.3,.7,.2,1);display:block;touch-action:pan-y}
.card.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:22px;text-align:center;overflow:hidden}
.face.back{transform:rotateY(180deg)}
.tag{position:absolute;top:12px;left:14px;right:14px;display:flex;justify-content:space-between;font-size:.75rem;color:var(--muted);gap:8px}
.kanji{font-family:var(--f-kanji);font-weight:500;line-height:1.25;word-break:break-all;max-width:100%}
.hint{position:absolute;bottom:12px;font-size:.78rem;color:var(--muted)}
.mean{font-size:1.45rem;font-weight:700;line-height:1.35;max-width:100%;overflow-wrap:anywhere}
.read{font-family:var(--f-kanji);font-size:2rem;color:var(--accent);overflow-wrap:anywhere}
.small-k{color:var(--muted);font-family:var(--f-kanji);font-size:1.1rem;overflow-wrap:anywhere}
.markbtn[aria-pressed="true"]{background:var(--good-soft);color:var(--good);border-color:var(--good);font-weight:700}
.nav2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nav2 .btn{padding:14px;font-size:1.05rem}
.kbd{color:var(--muted);font-size:.78rem;text-align:center}
.done{text-align:center;padding:24px 8px;display:flex;flex-direction:column;gap:12px;align-items:center}
.done h3{font-family:var(--f-kanji);font-size:1.6rem;margin:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.tile{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--raise)}
.tile b{display:block;font-size:1.6rem;font-family:var(--f-kanji);font-variant-numeric:tabular-nums;line-height:1.2}
.tile span{font-size:.8rem;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .bar-r{fill:var(--accent)}
.chart .grid{stroke:var(--line)}
.statrow{display:grid;grid-template-columns:5.5rem 1fr auto;gap:10px;align-items:center;font-size:.88rem}
.statrow .bar{margin:0;height:8px;position:relative}
.statrow .bar i.seen{position:absolute;inset:0 auto 0 0;background:var(--accent-soft)}
.statrow .bar i.hf{position:absolute;inset:0 auto 0 0;background:var(--good)}
.statrow em{font-style:normal;font-variant-numeric:tabular-nums;color:var(--muted);font-size:.8rem}
.legend{display:flex;gap:14px;font-size:.78rem;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.hist{display:flex;flex-direction:column}
.hist .it{padding:11px 0;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.hist .it:first-child{border-top:0}
.hist .it>div{min-width:0}
.hist small{color:var(--muted)}
.empty{color:var(--muted);padding:10px 0;margin:0}
.foot{font-size:.78rem;color:var(--muted);text-align:center}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.9rem}
/* kelola kotoba */
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:.78rem;color:var(--muted)}
input[type=text],input[type=number],textarea,select{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
textarea{min-height:130px;resize:vertical;line-height:1.45}
.form{display:flex;flex-direction:column;gap:10px;background:var(--raise);border:1px solid var(--line);border-radius:12px;padding:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.words{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.w{display:grid;grid-template-columns:1fr auto;gap:8px 10px;padding:11px 12px;border-top:1px solid var(--line);align-items:center;background:var(--surface)}
.w:first-child{border-top:0}
.w .tx{min-width:0}
.w .wk{font-family:var(--f-kanji);font-size:1.15rem;overflow-wrap:anywhere;line-height:1.3}
.w .wr{color:var(--accent);font-size:.82rem;overflow-wrap:anywhere}
.w .wm{color:var(--muted);font-size:.88rem;overflow-wrap:anywhere}
.w .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.w.edit,.w.conf{grid-template-columns:1fr}
.w .ok{color:var(--good);font-size:.75rem;font-weight:700}
.note{font-size:.88rem;color:var(--good);min-height:1.3em;margin:0}
.backrow{display:flex;gap:10px;align-items:center;justify-content:space-between}
.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:3;background:var(--bg);padding-block:4px}
.filebtn{position:relative;display:inline-flex;align-items:center;overflow:hidden}
.filebtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.filebtn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.lbl{font-size:.8rem;color:var(--muted);min-width:3.2rem}
.sample{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px;font-size:.88rem;color:var(--muted)}
.sample b{font-family:var(--f-kanji);color:var(--ink);font-weight:500}
.note.err{color:var(--bad)}
@media (max-width:480px){.statrow{grid-template-columns:4.2rem 1fr auto}.read{font-size:1.6rem}.mean{font-size:1.25rem}.card{min-height:300px}.grid2{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>

<script>
(function(){
'use strict';
var RAW=JSON.parse(document.getElementById('data').textContent);
var BASE=RAW.map(function(l){return {id:l.id,b:l.b,n:l.n,t:l.t,c:l.c.map(function(c,i){return {id:l.id+'#'+i,k:c[0],r:c[1],m:c[2],kj:c[3]};})};});
var BASEBY={};BASE.forEach(function(l){BASEBY[l.id]=l;});
var KEY='hafalan-kotoba-irodori-v1';
var S=null,LESSONS=[],BYID={},CARD={};
var tab='learn',view='pick',flipped=false,syncMode='lokal',confirmReset=false,swiped=0;
var sel={'1-1':1},cfg={order:'seq',kanji:'all',only:'all'};
// kelola kotoba
var wLid=null,wQ='',wEdit=null,wRename=false,wBulk=false,wExport=false,wNewCh=false,wConf=null,wNote='',bk=null,imp=null,ioMsg='',ioErr=false,ioText='';

function today(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function blank(){return {rev:0,marks:{},seen:{},daily:{},history:[],session:null,cfg:{order:'seq',kanji:'all',only:'all'},sel:{'1-1':1},deck:{},removed:{}};}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function val(id){var e=document.getElementById(id);return e?e.value:'';}
function hasKanji(s){return /[㐀-鿿]/.test(s);}
function bookName(b){return (b===1||b===2)?'Irodori Tingkat Dasar '+b:'Buku '+b;}
function lname(l){return 'Buku '+l.b+' · Bab '+l.n;}

// ---------- penyimpanan ----------
function loadLocal(){try{var r=localStorage.getItem(KEY);if(r)return JSON.parse(r);}catch(e){}return null;}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
var dbDoc=null,saveT=null;
function persist(){
  S.rev=Date.now();S.cfg=cfg;S.sel=sel;saveLocal();
  if(!dbDoc)return;
  clearTimeout(saveT);
  saveT=setTimeout(function(){dbDoc.set({json:JSON.stringify(S),rev:S.rev}).catch(function(){});},700);
}
function adopt(o){
  S=Object.assign(blank(),o);
  if(!S.deck)S.deck={};if(!S.removed)S.removed={};
  cfg=Object.assign({order:'seq',kanji:'all',only:'all'},S.cfg||{});
  sel=S.sel||{};
  rebuild();
}

// ---------- data kotoba (asli + perubahan) ----------
function rebuild(){
  LESSONS=[];BYID={};CARD={};
  BASE.forEach(function(l){if(S.removed[l.id])return;LESSONS.push(S.deck[l.id]||l);});
  Object.keys(S.deck).forEach(function(id){if(!BASEBY[id])LESSONS.push(S.deck[id]);});
  LESSONS.sort(function(a,b){return a.b-b.b||a.n-b.n;});
  LESSONS.forEach(function(l){BYID[l.id]=l;l.c.forEach(function(c){CARD[c.id]={l:l,id:c.id,k:c.k,r:c.r,m:c.m,kj:c.kj};});});
  Object.keys(sel).forEach(function(id){if(!BYID[id])delete sel[id];});
  var s=S.session;
  if(s){
    var out=[],before=0;
    s.ids.forEach(function(id,i){if(CARD[id])out.push(id);else if(i<s.pos)before++;});
    s.pos=Math.max(0,s.pos-before);s.ids=out;
    if(!out.length){S.session=null;if(view==='study'||view==='done')view='pick';}
    else if(s.pos>out.length)s.pos=out.length;
  }
}
function commit(){rebuild();persist();}
function ensureDeck(lid){
  if(!S.deck[lid])S.deck[lid]=JSON.parse(JSON.stringify(BYID[lid]||BASEBY[lid]));
  return S.deck[lid];
}
function newId(lid){return lid+'#n'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);}

// ---------- logika kartu ----------
function allIds(){return Object.keys(CARD);}
function card(id){return CARD[id];}
function buildDeck(){
  var ids=[];
  LESSONS.forEach(function(l){if(!sel[l.id])return;l.c.forEach(function(c){
    if(cfg.kanji==='kanji'&&!c.kj)return;
    if(cfg.only==='new'&&S.marks[c.id])return;
    ids.push(c.id);});});
  if(cfg.order==='rand'){for(var i=ids.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=ids[i];ids[i]=ids[j];ids[j]=t;}}
  return ids;
}
function selCount(){var n=0;LESSONS.forEach(function(l){if(sel[l.id])n+=1;});return n;}
function startSession(){
  var ids=buildDeck();if(!ids.length)return;
  var chs=LESSONS.filter(function(l){return sel[l.id];}).map(function(l){return l.id;});
  S.session={ids:ids,pos:0,chs:chs,started:Date.now(),updated:Date.now(),viewed:0,newHafal:0,hid:null,counted:{}};
  var h={id:Date.now(),t:Date.now(),chs:chs,total:ids.length,viewed:0,hafal:0,pos:0};
  S.history.unshift(h);if(S.history.length>200)S.history.pop();
  S.session.hid=h.id;
  view='study';flipped=false;persist();render();
}
function resumeSession(){if(!S.session)return;view='study';flipped=false;render();}
function histEntry(){var s=S.session;if(!s)return null;for(var i=0;i<S.history.length;i++)if(S.history[i].id===s.hid)return S.history[i];return null;}
function touchSession(){
  var s=S.session,h=histEntry();if(!s)return;
  s.updated=Date.now();
  if(h){h.viewed=s.viewed;h.hafal=s.newHafal;h.pos=s.pos;h.end=Date.now();}
}
function reveal(){
  if(Date.now()-swiped<400)return;
  if(flipped){flipped=false;}else{
    flipped=true;
    var s=S.session,id=s.ids[s.pos];
    if(!s.counted)s.counted={};
    if(!s.counted[s.pos]){
      s.counted[s.pos]=1;s.viewed+=1;
      S.seen[id]=(S.seen[id]||0)+1;
      var d=today();S.daily[d]=(S.daily[d]||0)+1;
      touchSession();persist();
    }
  }
  paintCard();
}
function go(dir){
  var s=S.session;if(!s)return;
  var np=s.pos+dir;
  if(np<0)return;
  if(np>=s.ids.length){s.pos=s.ids.length;touchSession();persist();view='done';render();return;}
  s.pos=np;flipped=false;touchSession();persist();render();
}
function toggleMark(){
  var s=S.session,id=s.ids[s.pos];
  if(S.marks[id]){delete S.marks[id];s.newHafal=Math.max(0,s.newHafal-1);}else{S.marks[id]=Date.now();s.newHafal+=1;}
  touchSession();persist();paintCard();
}

// ---------- tampilan ----------
var main=document.getElementById('main');
function render(){
  document.querySelectorAll('.tabs button').forEach(function(b){b.setAttribute('aria-selected',b.dataset.tab===tab?'true':'false');});
  document.getElementById('syncnote').textContent=syncMode==='akun'?'Progres dan kotoba tersimpan di akun Anda dan di browser ini.':'Progres dan kotoba tersimpan di browser ini.';
  if(tab==='stats')return renderStats();
  if(tab==='hist')return renderHist();
  if(tab==='words')return renderWords();
  if(view==='study')return renderStudy();
  if(view==='done')return renderDone();
  renderPick();
}
function chapterProgress(l){var h=0,s=0;l.c.forEach(function(c){if(S.marks[c.id])h++;if(S.seen[c.id])s++;});return {h:h,s:s,n:l.c.length};}
function books(){var r=[];LESSONS.forEach(function(l){if(r.indexOf(l.b)<0)r.push(l.b);});return r;}
function ago(t){var m=Math.round((Date.now()-t)/60000);if(m<1)return 'baru saja';if(m<60)return m+' menit lalu';var h=Math.round(m/60);if(h<24)return h+' jam lalu';return Math.round(h/24)+' hari lalu';}

function renderPick(){
  var html='',rs=S.session,size=buildDeck().length;
  if(rs&&rs.pos<rs.ids.length&&CARD[rs.ids[rs.pos]]){
    var cd=card(rs.ids[rs.pos]);
    html+='<div class="resume"><p><b>Lanjutkan hafalan terakhir</b><small>'+esc(lname(cd.l))+' · kartu '+(rs.pos+1)+' dari '+rs.ids.length+' · '+ago(rs.updated)+'</small></p><button class="btn primary" data-act="resume">Lanjutkan</button></div>';
  }
  html+='<section class="panel"><h2>Pilih bab</h2>';
  if(!LESSONS.length)html+='<p class="empty">Belum ada bab. Tambahkan bab di tab Kotoba.</p>';
  books().forEach(function(b){
    var ls=LESSONS.filter(function(l){return l.b===b;});
    var tot=0,hf=0;ls.forEach(function(l){var p=chapterProgress(l);tot+=p.n;hf+=p.h;});
    html+='<div class="book"><b>'+esc(bookName(b))+'</b><span class="row"><span style="color:var(--muted);font-size:.8rem">'+hf+'/'+tot+' hafal</span><button class="btn small" data-act="selall" data-book="'+b+'">Pilih semua</button><button class="btn small" data-act="selnone" data-book="'+b+'">Kosongkan</button></span></div>';
    html+='<div class="chs">';
    ls.forEach(function(l){
      var p=chapterProgress(l);var pct=p.n?Math.round(p.h/p.n*100):0;
      html+='<label class="ch"><input type="checkbox" data-ch="'+esc(l.id)+'"'+(sel[l.id]?' checked':'')+'><span class="t"><b>Bab '+l.n+'</b><span class="s">'+esc(l.t)+'</span><div class="bar"><i style="width:'+pct+'%"></i></div></span><span class="n">'+p.h+'/'+p.n+'</span></label>';
    });
    html+='</div>';
  });
  html+='</section>';

function parseLines(t){
  var out=[],skip=0;
  t.split(/\r?\n/).forEach(function(line){
    line=line.trim();if(!line)return;
    var p=line.split(/\s*[|\t]\s*/);
    if(p.length<2||!p[0]||!p[p.length-1]){skip++;return;}
    var k=p[0],r,m;
    if(p.length===2){r=k;m=p[1];}else{r=p[1]||k;m=p.slice(2).join(' | ');}
    out.push({k:k,r:r,m:m});
  });
  return {rows:out,skip:skip};
}

      ctx.font='700 30px "Shippori Mincho",serif';ctx.fillText('Hafalan Kotoba Irodori',M,M+10);
      ctx.font=BF;ctx.fillStyle='#586180';ctx.fillText('by Iman · halaman '+(pages.length+1),M,M+42);

      ctx.font=BB;ctx.fillStyle='#586180';ctx.fillText('KATA',cols[0].x,y);ctx.fillText('BACAAN',cols[1].x,y);ctx.fillText('ARTI',cols[2].x,y);

function parseCSV(text,delim){
  var rows=[],row=[],cell='',q=false;text=text.replace(/^﻿/,'');
  for(var i=0;i<text.length;i++){
    var ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cell+='"';i++;}else q=false;}else cell+=ch;}
    else if(ch==='"'&&cell===''){q=true;}
    else if(ch===delim){row.push(cell);cell='';}
    else if(ch==='\n'){row.push(cell);rows.push(row);row=[];cell='';}
    else if(ch==='\r'){}
    else cell+=ch;
  }
  if(cell!==''||row.length){row.push(cell);rows.push(row);}
  return rows.map(function(r){return r.map(function(c){return c.trim();});}).filter(function(r){return r.some(function(c){return c;});});
}
function parseDelimited(text){
  var first=(text.split(/\r?\n/).filter(function(l){return l.trim();})[0])||'';
  var d=first.indexOf('\t')>=0?'\t':first.indexOf('|')>=0?'|':',';
  return parseCSV(text,d);
}
function normH(s){return String(s==null?'':s).toLowerCase().replace(/\s+/g,' ').trim();}
var ALIAS={b:['buku','book'],n:['bab','chapter'],t:['judul','judul bab','title'],k:['kata','kanji','kotoba','word','kosakata'],r:['bacaan','cara baca','hiragana','reading','yomi'],m:['arti','makna','meaning','terjemahan']};
function mapHeader(row){
  var map={};
  row.forEach(function(c,i){var h=normH(c);Object.keys(ALIAS).forEach(function(k){if(ALIAS[k].indexOf(h)>=0&&map[k]===undefined)map[k]=i;});});
  return (map.k!==undefined&&map.m!==undefined)?map:null;
}
function tableToRows(tbl){
  var out=[],skip=0,start=0,map=tbl.length?mapHeader(tbl[0]):null;
  if(map)start=1;
  else{
    var w=0;tbl.slice(0,6).forEach(function(r){w=Math.max(w,r.length);});
    map=w>=6?{b:0,n:1,t:2,k:3,r:4,m:5}:w>=3?{k:0,r:1,m:2}:{k:0,m:1};
  }
  function cell(r,i){return i===undefined?'':String(r[i]==null?'':r[i]).trim();}
  for(var i=start;i<tbl.length;i++){
    var r=tbl[i],k=cell(r,map.k),m=cell(r,map.m);
    if(!k||!m){skip++;continue;}
    out.push({b:parseInt(cell(r,map.b),10)||0,n:parseInt(cell(r,map.n),10)||0,t:cell(r,map.t),k:k,r:cell(r,map.r)||k,m:m});
  }
  return {rows:out,skip:skip};
}
function readAsBuf(file){return new Promise(function(res,rej){var fr=new FileReader();fr.onload=function(){res(fr.result);};fr.onerror=function(){rej(new Error('File tidak bisa dibaca.'));};fr.readAsArrayBuffer(file);});}
function readAsText(file){return new Promise(function(res,rej){var fr=new FileReader();fr.onload=function(){res(String(fr.result));};fr.onerror=function(){rej(new Error('File tidak bisa dibaca.'));};fr.readAsText(file,'utf-8');});}
function pdfToTable(buf){
  return loadLib(URL_PDFW).then(function(){return loadLib(URL_PDFJS);}).then(function(){
    var lib=window.pdfjsLib;try{lib.GlobalWorkerOptions.workerSrc=URL_PDFW;}catch(e){}
    return lib.getDocument({data:new Uint8Array(buf)}).promise;
  }).then(function(pdf){
    var tbl=[],chain=Promise.resolve();
    for(var p=1;p<=pdf.numPages;p++){(function(p){chain=chain.then(function(){return pdf.getPage(p);}).then(function(pg){return pg.getTextContent();}).then(function(tc){
      var items=tc.items.filter(function(it){return it.str&&it.str.trim();}).map(function(it){return {s:it.str,x:it.transform[4],y:it.transform[5],w:it.width};});
      items.sort(function(a,b){return Math.abs(b.y-a.y)>3?b.y-a.y:a.x-b.x;});
      var lines=[],cur=null;
      items.forEach(function(it){if(cur&&Math.abs(cur.y-it.y)<=3)cur.items.push(it);else{cur={y:it.y,items:[it]};lines.push(cur);}});
      lines.forEach(function(L){
        L.items.sort(function(a,b){return a.x-b.x;});
        var cells=[],c='',prevEnd=null;
        L.items.forEach(function(it){
          if(prevEnd!==null&&it.x-prevEnd>10){cells.push(c.trim());c='';}
          c+=(prevEnd!==null&&it.x-prevEnd>1&&it.x-prevEnd<=10?' ':'')+it.s;prevEnd=it.x+it.w;
        });
        cells.push(c.trim());
        if(cells.length===1&&cells[0].indexOf('|')>=0)cells=cells[0].split('|').map(function(x){return x.trim();});
        cells=cells.filter(function(x){return x!=='';});
        if(cells.length>=2)tbl.push(cells);
      });
    });})(p);}
    return chain.then(function(){return tbl;});
  });
}
function fileToTables(file){
  var ext=(file.name.split('.').pop()||'').toLowerCase();
  if(ext==='csv'||ext==='tsv'||ext==='txt')return readAsText(file).then(function(t){return {tables:[parseDelimited(t)]};});
  if(ext==='json')return readAsText(file).then(function(t){
    var o=JSON.parse(t);
    if(o&&!Array.isArray(o)&&o.deck)return {backup:o};
    if(!Array.isArray(o))throw new Error('Format JSON tidak dikenali. Gunakan cadangan dari aplikasi ini atau daftar kata.');
    var tbl=[HEAD.slice()];
    o.forEach(function(x){tbl.push([x.buku||x.b||'',x.bab||x.n||'',x.judul||x.t||'',x.kata||x.k||'',x.bacaan||x.r||'',x.arti||x.m||'']);});
    return {tables:[tbl]};
  });
  if(ext==='xlsx'||ext==='xls')return Promise.all([readAsBuf(file),loadLib(URL_XLSX)]).then(function(r){
    var wb=XLSX.read(r[0],{type:'array'});
    return {tables:wb.SheetNames.map(function(n){return XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,raw:false,defval:''}).map(function(row){return row.map(function(c){return String(c).trim();});}).filter(function(row){return row.some(function(c){return c;});});})};
  });
  if(ext==='pdf')return readAsBuf(file).then(pdfToTable).then(function(t){if(!t.length)throw new Error('PDF ini tidak berisi teks yang bisa dibaca. PDF hasil pindai atau gambar tidak bisa diimpor. Gunakan CSV atau Excel.');return {tables:[t]};});
  throw new Error('Format .'+ext+' belum didukung. Gunakan CSV, Excel, TXT, JSON, atau PDF berteks.');
}
function handleImportFile(file){

    var rows=[],skip=0;
    res.tables.forEach(function(t){var x=tableToRows(t);rows=rows.concat(x.rows);skip+=x.skip;});

    imp={scope:scope,name:file.name,kind:'rows',rows:rows,skip:skip,mode:'add'};

      var nb=parseInt(val('nb'),10),nt=val('nt').trim();
      if(!nb||nb<1){return flash('Nomor buku harus angka 1 atau lebih.');}
      if(!nt){return flash('Isi judul bab terlebih dahulu.');}
      var mx=0;LESSONS.forEach(function(l){if(l.b===nb&&l.n>mx)mx=l.n;});
      BASE.forEach(function(l){if(l.b===nb&&l.n>mx)mx=l.n;});
      var id='c'+Date.now().toString(36);
      S.deck[id]={id:id,b:nb,n:mx+1,t:nt,c:[]};
      wNewCh=false;wNote='';commit();wLid=id;wEdit='new';wQ='';return render();
    }
    case 'open':imp=null;ioMsg='';ioText='';wLid=d.id;wQ='';wEdit=null;wRename=false;wBulk=false;wExport=false;wConf=null;wNote='';render();return window.scrollTo(0,0);
    case 'home':imp=null;ioMsg='';ioText='';wLid=null;wEdit=null;wConf=null;wNote='';render();return window.scrollTo(0,0);
    case 'restorech':delete S.removed[d.id];commit();return render();
    case 'addw':wEdit='new';wBulk=false;wExport=false;wNote='';return renderChapter();
    case 'editw':wEdit=d.id;wConf=null;wNote='';return renderChapter();
    case 'savew':return saveWord(d.id||null);
    case 'cancel':wEdit=null;wConf=null;wRename=false;wBulk=false;wExport=false;return renderWords();
    case 'delw':wConf='w:'+d.id;wEdit=null;return renderChapter();
    case 'delw-yes':{var dk=ensureDeck(wLid);dk.c=dk.c.filter(function(c){return c.id!==d.id;});delete S.marks[d.id];delete S.seen[d.id];wConf=null;wNote='Kata dihapus.';commit();return render();}
    case 'rename':wRename=true;return renderChapter();
    case 'saverename':{var t=val('ct').trim();if(!t){return;}ensureDeck(wLid).t=t;wRename=false;commit();return render();}
    case 'bulk':wBulk=!wBulk;wExport=false;wEdit=null;return renderChapter();
    case 'export':wExport=!wExport;wBulk=false;wEdit=null;return renderChapter();
    case 'copy':return copyText(d.t);
    case 'bulkadd':{
      var pr=parseLines(val('btxt'));
      if(!pr.rows.length){return flash('Tidak ada baris yang bisa dibaca. Gunakan format: kata | bacaan | arti.');}
      var dd=ensureDeck(wLid);
      pr.rows.forEach(function(r){dd.c.push({id:newId(wLid),k:r.k,r:r.r,m:r.m,kj:hasKanji(r.k)?1:0});});
      wBulk=false;wNote=pr.rows.length+' kata ditambahkan'+(pr.skip?', '+pr.skip+' baris dilewati.':'.');commit();return render();
    }
    case 'delch':wConf='delch';return renderChapter();
    case 'delch-yes':{
      var lid=wLid;
      if(BASEBY[lid])S.removed[lid]=1;
      delete S.deck[lid];delete sel[lid];
      wLid=null;wConf=null;commit();return render();
    }
    case 'resetch':wConf='resetch';return renderChapter();
    case 'resetch-yes':delete S.deck[wLid];wConf=null;wNote='Bab dikembalikan ke asli.';commit();return render();
    case 'resetdeck':wConf='resetdeck';return renderWords();
    case 'resetdeck-yes':S.deck={};S.removed={};wConf=null;wNote='Semua kotoba dikembalikan ke asli.';commit();return render();
    case 'bkshow':bk=bk==='show'?null:'show';wNote='';return renderWords();
    case 'bkrestore':bk=bk==='restore'?null:'restore';wNote='';return renderWords();
    case 'dorestore':{
      var o=null;try{o=JSON.parse(val('rbtxt'));}catch(e){}
      var ok=o&&typeof o==='object'&&o.deck&&typeof o.deck==='object'&&Object.keys(o.deck).every(function(k){var l=o.deck[k];return l&&Array.isArray(l.c)&&typeof l.b==='number'&&typeof l.n==='number';});
      if(!ok){return flash('Teks cadangan tidak valid.');}
      S.deck=o.deck;S.removed=(o.removed&&typeof o.removed==='object')?o.removed:{};bk=null;wNote='Cadangan dipulihkan.';commit();return render();
    }
  }
}
main.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t||!main.contains(t))return;
  act(t.dataset.act,t.dataset);
});
main.addEventListener('change',function(e){
  var i=e.target;
  if(i.id==='impfile'&&i.files&&i.files[0]){var f=i.files[0];i.value='';handleImportFile(f);return;}
  if(i.dataset&&i.dataset.ch){if(i.checked)sel[i.dataset.ch]=1;else delete sel[i.dataset.ch];persist();renderPick();}
});
main.addEventListener('input',function(e){
  if(e.target.id==='wq'&&wLid&&BYID[wLid]){wQ=e.target.value;document.getElementById('wlist').innerHTML=listHtml(BYID[wLid]);}
});
document.querySelectorAll('.tabs button').forEach(function(b){b.onclick=function(){tab=b.dataset.tab;confirmReset=false;wConf=null;imp=null;ioMsg='';ioText='';render();window.scrollTo(0,0);};});
document.addEventListener('keydown',function(e){
  if(tab!=='learn'||view!=='study')return;
  if(e.target&&/INPUT|TEXTAREA/.test(e.target.tagName))return;
  if(e.key==='ArrowRight'){e.preventDefault();go(1);}
  else if(e.key==='ArrowLeft'){e.preventDefault();go(-1);}
  else if(e.key===' '||e.key==='Enter'){if(e.target&&e.target.tagName==='BUTTON'&&e.target.id!=='card')return;e.preventDefault();reveal();}
});

// ---------- mulai ----------
adopt(loadLocal()||blank());
render();

function bootDb(){
  if(!window.claude||!window.claude.use)return;
  Promise.all([window.claude.use('db'),window.claude.use('user')]).then(function(r){
    var db=r[0],user=r[1];if(!db||!user||!user.id)return null;
    return user.id().then(function(id){
      if(!id)return null;
      dbDoc=db.collection('data/users/'+id+'/hafalan').doc('state');
      return dbDoc.get();
    });
  }).then(function(snap){
    if(!dbDoc)return;
    syncMode='akun';
    var remote=snap&&snap.exists?snap.data():null;
    if(remote&&remote.json){
      var o=null;try{o=JSON.parse(remote.json);}catch(e){}
      if(o&&(o.rev||0)>(S.rev||0)){adopt(o);saveLocal();if(!S.session&&(view==='study'||view==='done'))view='pick';render();return;}
    }
    if(S.rev){dbDoc.set({json:JSON.stringify(S),rev:S.rev}).catch(function(){});}
    render();
  }).catch(function(){});
}
bootDb();
})();
</script>
